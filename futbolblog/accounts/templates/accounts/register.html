{% extends 'accounts/base.html' %}

{% block title %}Registro - FutbolBlog{% endblock %}

{% block content %}
    <section>
        <h2>Crear cuenta</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Registrarme</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a>.</p>
    </section>
{% endblock %}
