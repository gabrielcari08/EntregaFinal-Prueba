{% extends 'accounts/base.html' %}

{% block content %}
    <h2>Editar Perfil</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Guardar Cambios</button>
    </form>

    <br>
    <a href="{% url 'profile' %}">Volver a mi perfil</a>
{% endblock %}
