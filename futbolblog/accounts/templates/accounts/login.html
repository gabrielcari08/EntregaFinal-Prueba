{% extends 'accounts/base.html' %}

{% block title %}Iniciar sesión - FutbolBlog{% endblock %}

{% block content %}
    <section>
        <h2>Iniciar sesión</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Entrar</button>
        </form>

        <p>¿No tienes una cuenta? <a href="{% url 'register' %}">Regístrate aquí</a>.</p>
    </section>
{% endblock %}
