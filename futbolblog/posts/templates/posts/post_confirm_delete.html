{% extends 'base.html' %}

{% block title %}Eliminar Post - FutbolBlog{% endblock %}

{% block content %}
  <h2>Eliminar Post</h2>
  <p>¿Estás seguro de que deseas eliminar el post "{{ post.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'post_detail' post.pk %}">Cancelar</a>
  </form>
{% endblock %}
