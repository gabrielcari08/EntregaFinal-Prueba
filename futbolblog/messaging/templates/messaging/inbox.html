{% extends 'base.html' %}

{% block content %}
<h2>Mensajes recibidos</h2>
{% for msg in messages %}
    <div>
        <strong>De:</strong> {{ msg.sender.username }}<br>
        <strong>Mensaje:</strong> {{ msg.content }}<br>
        <em>{{ msg.timestamp }}</em>
        <hr>
    </div>
{% empty %}
    <p>No tienes mensajes.</p>
{% endfor %}
<div class="profile-actions">
    <a href="{% url 'send_message' %}">Enviar un nuevo mensaje</a>
</div>
{% endblock %}
